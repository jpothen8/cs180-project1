<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Coarse-to-fine image pyramid</title>
<desc id="desc">Build upward by blurring and halving the image. Align downward from the smallest level, doubling each shift before local refinement. The example uses the measured dimensions of Melons.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#32656f"/></marker>
</defs>
<rect width="1000" height="560" rx="12" fill="#f5f4ef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202c30">
<text x="38" y="45" font-size="25" font-weight="600">Coarse-to-fine alignment</text>
<text x="38" y="75" font-size="17" fill="#53656b">Repeat separately for green → blue and red → blue.</text>
<text x="29" y="110" font-size="14" font-weight="600" fill="#32656f">BUILD</text>
<path d="M30 448 V135" fill="none" stroke="#32656f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="687" y="110" font-size="14" font-weight="600" fill="#32656f">ALIGN</text>
<path d="M706 145 V448" fill="none" stroke="#32656f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="745" y="154" font-size="18" font-weight="600">Search ±15 px</text>
<text x="745" y="180" font-size="16">at the coarsest level</text>
<text x="745" y="282" font-size="18" font-weight="600">At each finer level</text>
<text x="745" y="314" font-size="18">1. Double the shift</text>
<text x="745" y="344" font-size="18">2. Search ±2 px</text>
<text x="745" y="436" font-size="18" font-weight="600">Full-resolution shift</text>

<text x="90" text-anchor="end" y="154" font-size="18">1/32</text>
<rect x="289.0" y="126" width="82" height="40" rx="4" fill="#a2bdc3" stroke="#32656f" stroke-width="1.5"/>
<text x="584" y="153" font-size="17">118 × 102</text>
<text x="90" text-anchor="end" y="216" font-size="18">1/16</text>
<rect x="267.0" y="188" width="126" height="40" rx="4" fill="#aec7cb" stroke="#32656f" stroke-width="1.5"/>
<text x="584" y="215" font-size="17">236 × 203</text>
<text x="90" text-anchor="end" y="278" font-size="18">1/8</text>
<rect x="235.0" y="250" width="190" height="40" rx="4" fill="#bbd1d3" stroke="#32656f" stroke-width="1.5"/>
<text x="584" y="277" font-size="17">472 × 406</text>
<text x="90" text-anchor="end" y="340" font-size="18">1/4</text>
<rect x="194.0" y="312" width="272" height="40" rx="4" fill="#c8dadd" stroke="#32656f" stroke-width="1.5"/>
<text x="584" y="339" font-size="17">943 × 811</text>
<text x="90" text-anchor="end" y="402" font-size="18">1/2</text>
<rect x="148.0" y="374" width="364" height="40" rx="4" fill="#d6e4e5" stroke="#32656f" stroke-width="1.5"/>
<text x="584" y="401" font-size="17">1885 × 1621</text>
<text x="90" text-anchor="end" y="464" font-size="18">1/1</text>
<rect x="95.0" y="436" width="470" height="40" rx="4" fill="#e1ecec" stroke="#32656f" stroke-width="1.5"/>
<text x="584" y="463" font-size="17">3770 × 3241</text>
<text x="38" y="518" font-size="17">Build upward: blur with [1, 2, 1] / 4 on both axes, then sample every other pixel.</text>
<text x="38" y="542" font-size="17">Stop when the longest side is ≤200 px.</text>
</g></svg>
